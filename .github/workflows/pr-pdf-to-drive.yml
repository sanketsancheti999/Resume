name: Build resume PDF and upload to Google Drive

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-pdf-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live + tooling (Overleaf-like build)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full latexmk poppler-utils file rclone

      - name: Compile resume.tex to PDF
        run: |
          latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode resume.tex

      - name: Set names
        id: vars
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'no-pr' }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          pdf_name="resume-pr-${PR_NUMBER}-${short_sha}.pdf"
          artifact_name="resume-pdf-pr-${PR_NUMBER}-${short_sha}"
          echo "pdf_name=${pdf_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Rename generated PDF
        run: mv resume.pdf "${{ steps.vars.outputs.pdf_name }}"

      - name: Validate generated PDF
        run: |
          test -s "${{ steps.vars.outputs.pdf_name }}"
          file "${{ steps.vars.outputs.pdf_name }}" | grep -q 'PDF document'
          pdfinfo "${{ steps.vars.outputs.pdf_name }}" >/dev/null

      - name: Upload PDF artifact to workflow run
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.vars.outputs.artifact_name }}"
          path: "${{ steps.vars.outputs.pdf_name }}"
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add artifact usage note to run summary
        run: |
          echo "### Resume PDF artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact URL (GitHub auth required): ${{ steps.upload_artifact.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downloaded artifact is a ZIP. Extract to access PDF file: \`${{ steps.vars.outputs.pdf_name }}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure rclone (Google Drive)
        if: github.event_name == 'pull_request'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "RCLONE_CONFIG_GDRIVE secret is not set."
            exit 1
          fi

          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Upload PDF to Google Drive folder and create direct links
        if: github.event_name == 'pull_request'
        id: upload_drive
        env:
          GDRIVE_REMOTE: gdrive
          GDRIVE_FOLDER_ID: 1QFzYcqB8TJQujUX8yI-Gjq1wR-5_5jU2
        run: |
          rclone listremotes | grep -q "^${GDRIVE_REMOTE}:$" || {
            echo "Missing rclone remote '${GDRIVE_REMOTE}' in RCLONE_CONFIG_GDRIVE secret."
            exit 1
          }

          rclone copyto "${{ steps.vars.outputs.pdf_name }}" "${GDRIVE_REMOTE}:${{ steps.vars.outputs.pdf_name }}" \
            --drive-root-folder-id "${GDRIVE_FOLDER_ID}" \
            --drive-stop-on-upload-limit \
            --checksum \
            --verbose

          view_link="$(rclone link "${GDRIVE_REMOTE}:${{ steps.vars.outputs.pdf_name }}" --drive-root-folder-id "${GDRIVE_FOLDER_ID}")"
          file_id="$(echo "$view_link" | sed -n 's|.*\/d\/\([^/]*\)\/.*|\1|p')"

          if [ -n "$file_id" ]; then
            direct_link="https://drive.google.com/uc?export=download&id=${file_id}"
          else
            direct_link=""
          fi

          echo "view_link=${view_link}" >> "$GITHUB_OUTPUT"
          echo "direct_link=${direct_link}" >> "$GITHUB_OUTPUT"

      - name: Comment PR with PDF links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ steps.vars.outputs.artifact_name }}
          PDF_NAME: ${{ steps.vars.outputs.pdf_name }}
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
          DRIVE_VIEW_LINK: ${{ steps.upload_drive.outputs.view_link }}
          DRIVE_DIRECT_LINK: ${{ steps.upload_drive.outputs.direct_link }}
        with:
          script: |
            const body = [
              '✅ Resume PDF generated successfully.',
              '',
              `- Google Drive (view): ${process.env.DRIVE_VIEW_LINK || '_Unavailable_'}`,
              `- Google Drive (direct download): ${process.env.DRIVE_DIRECT_LINK || '_Unavailable_'}`,
              `- GitHub Artifact: ${process.env.ARTIFACT_URL || '_Unavailable_'} (requires GitHub auth; ZIP download, then extract **${process.env.PDF_NAME}**)`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
