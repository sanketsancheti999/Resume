name: Build resume PDF and upload to Google Drive

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-pdf-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile resume.tex to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true

      - name: Set PDF artifact name
        id: vars
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'no-pr' }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "pdf_name=resume-pr-${PR_NUMBER}-${short_sha}.pdf" >> "$GITHUB_OUTPUT"

      - name: Rename generated PDF
        run: mv resume.pdf "${{ steps.vars.outputs.pdf_name }}"

      - name: Upload PDF artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.vars.outputs.pdf_name }}"
          path: "${{ steps.vars.outputs.pdf_name }}"
          if-no-files-found: error

      - name: Install rclone
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure rclone (Google Drive)
        if: github.event_name == 'pull_request'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "RCLONE_CONFIG_GDRIVE secret is not set."
            exit 1
          fi

          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Upload PDF to Google Drive folder
        if: github.event_name == 'pull_request'
        env:
          GDRIVE_REMOTE: gdrive
          GDRIVE_FOLDER_ID: 1QFzYcqB8TJQujUX8yI-Gjq1wR-5_5jU2
        run: |
          rclone listremotes | grep -q "^${GDRIVE_REMOTE}:$" || {
            echo "Missing rclone remote '${GDRIVE_REMOTE}' in RCLONE_CONFIG_GDRIVE secret."
            exit 1
          }

          rclone copy "${{ steps.vars.outputs.pdf_name }}" "${GDRIVE_REMOTE}:" \
            --drive-root-folder-id "${GDRIVE_FOLDER_ID}" \
            --drive-stop-on-upload-limit \
            --checksum \
            --verbose
