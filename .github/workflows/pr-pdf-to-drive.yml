name: Build resume PDF and upload to Google Drive

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-pdf-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live + tooling (Overleaf-like build)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full latexmk poppler-utils file

      - name: Compile resume.tex to PDF
        run: |
          latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode resume.tex

      - name: Set names
        id: vars
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'no-pr' }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          pdf_name="resume-pr-${PR_NUMBER}-${short_sha}.pdf"
          artifact_name="resume-pdf-pr-${PR_NUMBER}-${short_sha}"
          echo "pdf_name=${pdf_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Rename generated PDF
        run: mv resume.pdf "${{ steps.vars.outputs.pdf_name }}"

      - name: Validate generated PDF
        run: |
          test -s "${{ steps.vars.outputs.pdf_name }}"
          file "${{ steps.vars.outputs.pdf_name }}" | grep -q 'PDF document'
          pdfinfo "${{ steps.vars.outputs.pdf_name }}" >/dev/null

      - name: Upload PDF artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.vars.outputs.artifact_name }}"
          path: "${{ steps.vars.outputs.pdf_name }}"
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add artifact usage note to run summary
        run: |
          echo "### Resume PDF artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the artifact and extract the ZIP to access the PDF file." >> "$GITHUB_STEP_SUMMARY"
          echo "- PDF filename: \`${{ steps.vars.outputs.pdf_name }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install rclone
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone (Google Drive)
        if: github.event_name == 'pull_request'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "RCLONE_CONFIG_GDRIVE secret is not set."
            exit 1
          fi

          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Upload PDF to Google Drive folder
        if: github.event_name == 'pull_request'
        id: upload_drive
        env:
          GDRIVE_REMOTE: gdrive
          GDRIVE_FOLDER_ID: 1QFzYcqB8TJQujUX8yI-Gjq1wR-5_5jU2
        run: |
          rclone listremotes | grep -q "^${GDRIVE_REMOTE}:$" || {
            echo "Missing rclone remote '${GDRIVE_REMOTE}' in RCLONE_CONFIG_GDRIVE secret."
            exit 1
          }

          rclone copy "${{ steps.vars.outputs.pdf_name }}" "${GDRIVE_REMOTE}:" \
            --drive-root-folder-id "${GDRIVE_FOLDER_ID}" \
            --drive-stop-on-upload-limit \
            --checksum \
            --verbose

          file_link="$(rclone link "${GDRIVE_REMOTE}:${{ steps.vars.outputs.pdf_name }}" --drive-root-folder-id "${GDRIVE_FOLDER_ID}")"
          echo "file_link=${file_link}" >> "$GITHUB_OUTPUT"

      - name: Comment PR with PDF links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ steps.vars.outputs.artifact_name }}
          PDF_NAME: ${{ steps.vars.outputs.pdf_name }}
          DRIVE_FILE_LINK: ${{ steps.upload_drive.outputs.file_link }}
        with:
          script: |
            const body = [
              '✅ Resume PDF generated successfully.',
              '',
              `- Artifact: **${process.env.ARTIFACT_NAME}** (download as ZIP from the run artifacts, then extract **${process.env.PDF_NAME}**).`,
              `- Google Drive: ${process.env.DRIVE_FILE_LINK || '_Drive link unavailable_'}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
